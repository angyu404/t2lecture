<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lectra</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 40px;
    }

    .video-box {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16/9;
      margin-top: 20px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: black;
    }

    /* FIXES CLICK ISSUE */
    #videoOutput {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      pointer-events: none;
      z-index: 1;
    }

    button {
      margin-top: 15px;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Lectra Upload</h2>

  <input type="file" id="fileInput" accept="video/*">

  <div class="video-box">
    <video id="videoOutput" controls playsinline style="display:none;"></video>
    <div class="video-placeholder" id="videoPlaceholder">
      Upload a video to preview
    </div>
  </div>

  <button id="clearBtn">Clear</button>

  <script>
    const fileInput = document.getElementById("fileInput");
    const videoOutput = document.getElementById("videoOutput");
    const videoPlaceholder = document.getElementById("videoPlaceholder");
    const clearBtn = document.getElementById("clearBtn");

    let currentVideoURL = null;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      // optional size check
      if (file.size > 500 * 1024 * 1024) {
        alert("File too large (max 500MB)");
        return;
      }

      previewVideo(file);
    });

    function previewVideo(file) {
      if (!file) return;

      // CLEAN OLD URL (fix memory leak)
      if (currentVideoURL) {
        URL.revokeObjectURL(currentVideoURL);
      }

      currentVideoURL = URL.createObjectURL(file);

      videoOutput.src = currentVideoURL;
      videoOutput.style.display = "block";

      videoPlaceholder.style.display = "none";
      videoPlaceholder.style.pointerEvents = "none";
    }

    clearBtn.addEventListener("click", () => {
      fileInput.value = "";

      if (currentVideoURL) {
        URL.revokeObjectURL(currentVideoURL);
        currentVideoURL = null;
      }

      videoOutput.pause();
      videoOutput.src = "";
      videoOutput.load();
      videoOutput.style.display = "none";

      videoPlaceholder.style.display = "flex";
      videoPlaceholder.style.pointerEvents = "auto";
    });
  </script>

</body>

</html>
